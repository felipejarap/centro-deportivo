spring.application.name=MS-Entrenadores
# Puerto de ejecución
server.port=8085

# Configuración de base de datos MySQL
# Asegúrate de que la base de datos 'db_Entrenador' esté creada en tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/db_Entrenador?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Dialecto y estrategia de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'none' o 'validate' es correcto cuando usas Flyway para no interferir con las migraciones
spring.jpa.hibernate.ddl-auto=none

# Configuración de Logs y SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.output.ansi.enabled=always

# Configuración de Flyway Migration
spring.flyway.enabled=true
# Esto permite que Flyway cree la tabla de historia si es la primera vez que se ejecuta
spring.flyway.baseline-on-migrate=true