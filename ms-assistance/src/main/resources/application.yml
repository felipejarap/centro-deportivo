spring:
  application:
    name: ms.asistencia
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
  cloud:
    openfeign:
      client:
        config:
          default:
            decode404: true
server:
  port: 8089
eureka:
  instance:
    prefer-ip-address: true
springdoc:
  swagger-ui:
    path: /api-docs
    operationsSorter: method
    tagsSorter: alpha
    defaultModelsExpandDepth: -1