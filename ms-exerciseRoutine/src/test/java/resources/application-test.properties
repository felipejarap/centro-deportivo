# Base de datos en memoria para tests con modo de compatibilidad MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Deshabilitar Flyway por completo en el entorno de pruebas
spring.flyway.enabled=false

# Permitir que Hibernate maneje las tablas limpiamente en H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
