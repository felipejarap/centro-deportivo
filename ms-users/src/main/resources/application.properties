
spring.application.name=ms-users

# Puerto de ejecuciùn
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
# Configuraciùn de base de datos MySQL
# Asegùrate de que la base de datos 'db_users' estù creada en tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/db_users?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Dialecto y estrategia de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'none' o 'validate' es correcto cuando usas Flyway para no interferir con las migraciones
spring.jpa.hibernate.ddl-auto=none

# Configuraciùn de Logs y SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.output.ansi.enabled=always

# Configuraciùn de Flyway Migration
spring.flyway.enabled=true
# Esto permite que Flyway cree la tabla de historia si es la primera vez que se ejecuta
spring.flyway.baseline-on-migrate=true


springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=-1