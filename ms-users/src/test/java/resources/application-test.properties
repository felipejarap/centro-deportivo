# Base de datos en memoria con modo compatibilidad MySQL y escape estricto de USER
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS="USER"
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar Flyway en pruebas solo si deseas que aplique este script en H2
spring.flyway.enabled=true

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
